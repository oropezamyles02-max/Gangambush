name: Build Gang Ambush DLL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore GangAmbush.csproj

      - name: Build DLL
        run: dotnet build GangAmbush.csproj --configuration Release --no-restore

      - name: Save mod DLL
        uses: actions/upload-artifact@v4
        with:
          name: GangAmbush-DLL
          path: bin/Release/net48/GangAmbush.dll
          if-no-files-found: error

